name: sendtrace

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sendtrace
      POSTGRES_USER: sendtrace
      POSTGRES_PASSWORD: sendtrace
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sendtrace"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dbdata:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
    ports:
      - "4566:4566"
    volumes:
      - ./ops/localstack/init-queue.sh:/etc/localstack/init/ready.d/init-queue.sh:ro
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/sendtrace
      DB_USER: sendtrace
      DB_PASSWORD: sendtrace
      AWS_SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/sendtrace-outbound
    ports:
      - "8080:8080"

volumes:
  dbdata:
